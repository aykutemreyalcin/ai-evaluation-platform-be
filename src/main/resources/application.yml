spring:
  application:
    name: ai-evaluation-platform
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  langfuse:
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
    enabled: ${LANGFUSE_ENABLED:false}
    environment: ${LANGFUSE_ENVIRONMENT:development}
  adapters:
    ata-rag:
      base-url: ${ATA_RAG_BASE_URL:http://localhost:8081}
    internship-coordinator:
      base-url: ${INTERNSHIP_COORDINATOR_BASE_URL:http://localhost:8082}
